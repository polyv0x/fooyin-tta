name: Linux builds and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FOOYIN_VERSION: '0.13.1'
  FOOYIN_REVISION: '9f6e9364b9d1cdcccecf598db08b84b3f701e1b0'
  RUST_VERSION: '1.85.1'

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git ninja-build pkg-config python3 \
            libicu-dev libtag1-dev zlib1g-dev qt6-base-dev libqt6svg6-dev \
            libqt6sql6-sqlite libavcodec-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev

      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check release version
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          cmake = pathlib.Path("CMakeLists.txt").read_text()
          assert re.search(r"project\(fooyin_tta VERSION " + re.escape(version) + r"\s", cmake)
          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text())
          assert next(p["version"] for p in lock["package"] if p["name"] == "fooyin-tta") == version
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == "v" + version, "Tag must match the package version"
          PY

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore fooyin SDK
        id: sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /opt/fooyin
          key: fooyin-sdk-bookworm-${{ matrix.arch }}-${{ env.FOOYIN_REVISION }}-v1

      - name: Check out fooyin
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fooyin/fooyin
          ref: ${{ env.FOOYIN_REVISION }}
          path: build/fooyin-src
          submodules: recursive
          persist-credentials: false

      - name: Build fooyin SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          cmake -S build/fooyin-src -B build/fooyin-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/fooyin \
            -DCMAKE_INSTALL_LIBDIR=lib -DINSTALL_HEADERS=ON \
            -DBUILD_PLUGINS=OFF -DBUILD_ALSA=OFF -DBUILD_TRANSLATIONS=OFF \
            -DBUILD_TESTING=OFF -DBUILD_CCACHE=OFF
          cmake --build build/fooyin-sdk --parallel 2
          cmake --install build/fooyin-sdk --strip

      - name: Build plugin
        run: |
          cmake -S . -B build/plugin -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/fooyin \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/..' \
            -DTTA_PLUGIN_INSTALL_DIR=/usr/lib/fooyin/plugins -DBUILD_TESTING=ON
          cmake --build build/plugin --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/plugin --output-on-failure

      - name: Package and test installed plugin
        env:
          ARCH: ${{ matrix.arch }}
        run: bash ci/package.sh build/plugin "$ARCH" "$FOOYIN_VERSION"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download tested archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "True Audio $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
